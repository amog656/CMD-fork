run_name: 'oracle_class_cond'
logdir: 'C:/Users/hanut sai/CMD-GEN/DiffPhar/results/logdir/'
wandb_params:
  mode: 'disabled'  # disabled, offline, online
  entity: 'my_wandb_entity'
dataset: 'crossdock'
datadir: 'C:/Users/hanut sai/CMD-GEN/DiffPhar/data_raw/processed_crossdock_noH_ca_only_temp/'
enable_progress_bar: TRUE
num_sanity_val_steps: 0

model_type: 'flow_matching'

mode: 'pocket_conditioning'  # joint, pocket_conditioning, SimpleConditionalDDPM
pocket_representation: 'CA' # full-atom, CA
batch_size: 4 # 32
lr: 1.0e-4
n_epochs: 5
num_workers: 0
gpus: 1
clip_grad: True
augment_rotation: False
augment_noise: 0

egnn_params:
  device: 'cuda'
  edge_cutoff: 6.0
  joint_nf: 32
  hidden_nf: 256
  n_layers: 5
  attention: True
  tanh: True
  norm_constant: 1
  inv_sublayers: 1
  sin_embedding: False
  aggregation_method: 'sum'
  normalization_factor: 100  # used if aggregation_method='sum'

diffusion_params:
  diffusion_steps: 500
  diffusion_noise_schedule: 'polynomial_2'
  diffusion_noise_precision: 1.0e-5
  diffusion_loss_type: 'l2'
  normalize_factors: [1, 4]  # [x, h]
  lambda_h: 1.0

oracle_class_training: true

eval_epochs: 1
eval_params:
  n_eval_samples: 10
  eval_batch_size: 10